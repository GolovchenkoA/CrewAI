[project]
name = "standalone-calls"
version = "0.1.0"
description = "LLM.call and Agent.kickoff without a crew"
requires-python = ">=3.12,<3.14"
dependencies = [
    "crewai[anthropic]~=1.15.44",
    "python-dotenv~=1.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/standalone_calls"]

# Script names are project-specific: all workspace members share one .venv.
[project.scripts]
standalone_run = "standalone_calls.main:run"

[tool.crewai]
type = "crew"

[dependency-groups]
dev = ["pytest~=9.2.0"]

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning:crewai.*"]
