[project]
name = "crewai-learning"
version = "0.1.0"
description = "uv workspace root for the CrewAI learning projects"
requires-python = ">=3.12,<3.14"
dependencies = [
    "research-report-crew",
    "support-ticket-triage-flow",
    "code-review-agent",
    "hierarchical-delegation",
    "conditional-tasks",
    "streaming",
    "standalone-calls",
    "flow-checkpoint",
    "conversational-flow",
    "agent-reasoning",
]

[tool.uv]
# The root only aggregates the members; it is not a package itself.
package = false
# crewai[anthropic] pins anthropic~=0.73.0; the OpenInference Anthropic instrumentor needs a newer SDK.
override-dependencies = ["anthropic~=2.12.0"]

[tool.uv.sources]
research-report-crew = { workspace = true }
support-ticket-triage-flow = { workspace = true }
code-review-agent = { workspace = true }
hierarchical-delegation = { workspace = true }
conditional-tasks = { workspace = true }
streaming = { workspace = true }
standalone-calls = { workspace = true }
flow-checkpoint = { workspace = true }
conversational-flow = { workspace = true }
agent-reasoning = { workspace = true }

[tool.uv.workspace]
members = [
    "01-research-report-crew",
    "02-support-ticket-triage-flow",
    "03-code-review-agent",
    "04-hierarchical-delegation",
    "05-conditional-tasks",
    "06-streaming",
    "07-standalone-calls",
    "08-flow-checkpoint",
    "09-conversational-flow",
    "10-agent-reasoning",
]

[dependency-groups]
dev = ["ruff~=0.17.6"]