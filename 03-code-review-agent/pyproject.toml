[project]
name = "code-review-agent"
version = "0.1.0"
description = "CrewAI pull request review service"
requires-python = ">=3.12,<3.14"
dependencies = [
    "crewai[anthropic,tools]~=1.15.41",
    "fastapi~=0.162.5",
    "uvicorn~=0.54.0",
    "httpx~=0.28.1",
    "python-dotenv~=1.2.4",
    "opentelemetry-sdk~=1.45.2",
    "opentelemetry-exporter-otlp~=1.45.2",
    "openinference-instrumentation-crewai~=1.1.29",
    "openinference-instrumentation-anthropic~=3.3.8",
    "openinference-instrumentation-openai~=0.1.76",
]

[project.scripts]
code_review_run = "code_review.main:run"
code_review_train = "code_review.main:train"
code_review_test = "code_review.main:test"

[dependency-groups]
dev = ["pytest~=9.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_review"]

[tool.crewai]
type = "crew"

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning:crewai.*"]
