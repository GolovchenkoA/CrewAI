[project]
name = "code-review-agent"
version = "0.1.0"
description = "CrewAI pull request review service"
requires-python = ">=3.12,<3.14"
dependencies = [
    "crewai[anthropic,tools]>=1.15.41,<2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "openinference-instrumentation-crewai>=1.1.29",
]

[project.scripts]
code_review_run = "code_review.main:run"
code_review_train = "code_review.main:train"
code_review_test = "code_review.main:test"

[dependency-groups]
dev = ["pytest>=9.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_review"]

[tool.crewai]
type = "crew"

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning:crewai.*"]
