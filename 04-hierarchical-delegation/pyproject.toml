[project]
name = "hierarchical-delegation"
version = "0.1.0"
description = "Manager agent delegating to workers (hierarchical process)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "crewai[anthropic]~=1.15.44",
    "python-dotenv~=1.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hierarchical_delegation"]

# Script names are project-specific: all workspace members share one .venv.
[project.scripts]
hierarchical_run = "hierarchical_delegation.main:run"

[tool.crewai]
type = "crew"

[dependency-groups]
dev = ["pytest~=9.2.0"]

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning:crewai.*"]
