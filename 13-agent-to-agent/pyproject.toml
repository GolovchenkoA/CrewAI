[project]
name = "agent-to-agent"
version = "0.1.0"
description = "Agent-to-agent (A2A) protocol: a server agent and a client agent"
requires-python = ">=3.12,<3.14"
dependencies = [
    "crewai[anthropic,a2a]~=1.15.44",
    "python-dotenv~=1.2.4",
    "uvicorn~=0.54.0",
    "httpx~=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_to_agent"]

# Script names are project-specific: all workspace members share one .venv.
[project.scripts]
a2a_serve = "agent_to_agent.server:run"
a2a_ask = "agent_to_agent.client:run"

[tool.crewai]
type = "crew"

[dependency-groups]
dev = ["pytest~=9.2.0"]

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning:crewai.*"]
