[project]
name = "agent-reasoning"
version = "0.1.0"
description = "Agent planning (reasoning) before acting"
requires-python = ">=3.12,<3.14"
dependencies = [
    "crewai[anthropic]~=1.15.44",
    "python-dotenv~=1.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_reasoning"]

# Script names are project-specific: all workspace members share one .venv.
[project.scripts]
reasoning_run = "agent_reasoning.main:run"

[tool.crewai]
type = "crew"

[dependency-groups]
dev = ["pytest~=9.2.0"]

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning:crewai.*"]
