[project]
name = "support-ticket-triage-flow"
version = "0.1.0"
description = "Event-driven CrewAI flow that triages support tickets"
requires-python = ">=3.12,<3.14"
dependencies = [
    "crewai[anthropic,tools]~=1.15.41",
    "mcp~=1.30.0",
    "fastapi~=0.162.5",
    "uvicorn~=0.54.0",
    "python-dotenv~=1.2.4",
    "pyyaml~=6.0.3",
    "ollama~=0.6.3",   # Ollama embedder for Memory / Knowledge
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage_flow"]

# Script names are project-specific: all workspace members share one .venv,
# so generic names (kickoff, plot, run_crew) would collide with the other projects.
[project.scripts]
triage_flow_kickoff = "triage_flow.main:kickoff"
triage_flow_plot = "triage_flow.main:plot"

[tool.crewai]
type = "flow"

[dependency-groups]
dev = [
    "pytest~=9.2.0",
]
