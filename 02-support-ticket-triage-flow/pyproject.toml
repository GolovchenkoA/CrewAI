[project]
name = "support-ticket-triage-flow"
version = "0.1.0"
description = "Event-driven CrewAI flow that triages support tickets"
requires-python = ">=3.12,<3.14"
dependencies = [
    "crewai[anthropic,tools]>=1.15.41,<2",
    "mcp>=1.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage_flow"]

[tool.crewai]
type = "flow"
