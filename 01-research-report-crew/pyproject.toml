[project]
name = "research-report-crew"
version = "0.1.0"
description = "Four-agent crew that turns a topic into a Markdown report"
requires-python = ">=3.12,<3.14"
dependencies = [
    "crewai[litellm,anthropic,tools]>=1.15.41,<2",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_crew"]

[tool.crewai]
type = "crew"
