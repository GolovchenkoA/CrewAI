[project]
name = "research-report-crew"
version = "0.1.0"
description = "Four-agent crew that turns a topic into a Markdown report"
requires-python = ">=3.12,<3.14"
dependencies = [
    "crewai[litellm,anthropic,tools]>=1.15.41,<2",
    "python-dotenv>=1.0",
]

# Script names are project-specific: all workspace members share one .venv,
# so generic names (run_crew, train, test, replay) would collide with project 03.
[project.scripts]
research_crew = "research_crew.main:run"
research_crew_run = "research_crew.main:run"
research_crew_train = "research_crew.main:train"
research_crew_replay = "research_crew.main:replay"
research_crew_test = "research_crew.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_crew"]

[tool.crewai]
type = "crew"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
